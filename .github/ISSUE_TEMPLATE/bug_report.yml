name: Bug report
description: Report a reproducible problem without private plan data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, capability URLs, private plans, or vulnerabilities. Use the Security tab for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, commit, Node version, and operating system.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, using sanitized or synthetic data only?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps or a disposable fixture.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private paths, capability URLs, and private plan content.
          required: true
